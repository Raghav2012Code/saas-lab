<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SaaS Calculator — one model for your whole SaaS</title>
    <meta
      name="description"
      content="Enter your SaaS assumptions once and see MRR, ARR, LTV:CAC, payback, runway and projections recalculate together. Local-first, no account required."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141719" />
    <script>
      // Apply the stored theme before first paint so there is no flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('saaslab.theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          /* first run or storage blocked: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
